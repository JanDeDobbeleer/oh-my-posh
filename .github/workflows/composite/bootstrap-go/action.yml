# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: "Setup Go"
description: "Install Go and override with the custom build"
branding:
  icon: download
  color: purple
runs:
  using: "composite"
  steps:
    - uses: actions/setup-go@v5.0.0
      with:
        go-version: "1.27.0"
        cache-dependency-path: src/go.sum
