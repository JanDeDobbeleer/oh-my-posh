name: Merge contributions PR
on:
  pull_request_target:
    types:
      - opened
      - reopened

# The merge goes through the personal token, the job token only checks out.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code 👋
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check and merge ⛙
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const { repo: { owner, repo } } = context;
            const pr = context.payload.pull_request;

            if (pr.user.id !== 46447321) {
              console.log('Not an all-contributors pull request');
              return;
            }

            console.log(`Merging pull request: ${pr.html_url}`);
            await github.rest.pulls.merge({
              owner, repo,
              pull_number: pr.number,
              merge_method: "rebase",
            });
